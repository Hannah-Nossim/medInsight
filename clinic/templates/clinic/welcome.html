<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Welcome - MedInsight Clinic</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-gray-50 flex flex-col min-h-screen">

    <!-- Navbar -->
    <nav class="bg-white shadow">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex justify-between h-16">
                <div class="flex items-center">
                    <h1 class="text-2xl font-bold text-indigo-600">MedInsight Clinic</h1>
                </div>
                <div class="flex items-center space-x-4">
                    <a href="{% url 'login' %}"
                        class="text-gray-700 hover:text-indigo-600 px-3 py-2 rounded-md text-sm font-medium">Login</a>
                    <a href="{% url 'register' %}"
                        class="bg-indigo-600 text-white px-4 py-2 rounded-md text-sm font-medium hover:bg-indigo-700">Register</a>
                </div>
            </div>
        </div>
    </nav>

    <!-- Content -->
    <div class="flex-grow flex items-center justify-center p-6">
        <div class="text-center max-w-2xl">
            <h1 class="text-4xl font-extrabold text-gray-900 mb-6">Welcome to Patient Management</h1>
            <p class="text-lg text-gray-600 mb-8">
                Streamline your clinic operations with our integrated patient registry and AI-powered consultation
                tools.
            </p>
            <div class="flex justify-center space-x-4">
                <a href="{% url 'login' %}"
                    class="px-8 py-3 border border-transparent text-base font-medium rounded-md text-white bg-indigo-600 hover:bg-indigo-700 md:py-4 md:text-lg">
                    Clinician Login
                </a>
                <a href="{% url 'register' %}"
                    class="px-8 py-3 border border-transparent text-base font-medium rounded-md text-indigo-700 bg-indigo-100 hover:bg-indigo-200 md:py-4 md:text-lg">
                    Register New Account
                </a>
            </div>
        </div>
    </div>

</body>

</html>
